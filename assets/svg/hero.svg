<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Aoyue SkyMind 工业无人机平台示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1422"/>
      <stop offset="100%" stop-color="#02060c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#5e5ce6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="280" fill="url(#glow)"/>
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>
  <!-- drone body -->
  <g transform="translate(400 300)">
    <g stroke="url(#frame)" stroke-width="3" fill="none">
      <rect x="-60" y="-20" width="120" height="40" rx="14"/>
      <line x1="-60" y1="0" x2="-150" y2="-60"/>
      <line x1="-60" y1="0" x2="-150" y2="60"/>
      <line x1="60" y1="0" x2="150" y2="-60"/>
      <line x1="60" y1="0" x2="150" y2="60"/>
    </g>
    <g>
      <circle cx="-150" cy="-60" r="28" fill="#0a0c10" stroke="#00d4ff" stroke-width="2"/>
      <circle cx="-150" cy="60" r="28" fill="#0a0c10" stroke="#00d4ff" stroke-width="2"/>
      <circle cx="150" cy="-60" r="28" fill="#0a0c10" stroke="#00d4ff" stroke-width="2"/>
      <circle cx="150" cy="60" r="28" fill="#0a0c10" stroke="#00d4ff" stroke-width="2"/>
      <g stroke="#a8aebd" stroke-width="1.5" fill="none" opacity="0.6">
        <circle cx="-150" cy="-60" r="20"/>
        <circle cx="-150" cy="60" r="20"/>
        <circle cx="150" cy="-60" r="20"/>
        <circle cx="150" cy="60" r="20"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="8" fill="#00d4ff"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  </g>
  <g fill="#a8aebd" font-family="Manrope, sans-serif" font-size="12" letter-spacing="3">
    <text x="40" y="60">SKYMIND · INDUSTRIAL UAV</text>
    <text x="40" y="560" fill="#00d4ff">v1.0 / 工业级低空生产力平台</text>
  </g>
  <g stroke="rgba(0,212,255,0.35)" stroke-dasharray="4 4" fill="none">
    <circle cx="400" cy="300" r="180"/>
    <circle cx="400" cy="300" r="240"/>
  </g>
</svg>
